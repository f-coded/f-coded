name: Generate contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build the snake graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg
            assets/contributions-dark.svg?palette=github-dark

      - name: Commit the updated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update contribution graph
          file_pattern: assets/*.svg
